<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>General Contractor PDF Printer</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel-bg: #f7f7f8;
    --border: #e3e3e6;
    --text: #1c1c1e;
    --text-dim: #6b6b70;
    --accent: #16795c;
    --accent-soft: #e6f4ef;
    --danger: #b3261e;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font); color: var(--text); background: var(--bg);
    font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #topbar {
    display: flex; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); background: var(--panel-bg);
  }
  #searchInput {
    flex: 1; font-family: inherit; font-size: 13px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #fff; color: var(--text); outline: none;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  #status { padding: 2px 12px; font-size: 11px; color: var(--text-dim); min-height: 16px; }
  #status.error { color: var(--danger); }

  #main { flex: 1; display: flex; overflow: hidden; }

  #resultsPane {
    width: 260px; min-width: 180px; max-width: 40%;
    border-right: 1px solid var(--border);
    overflow-y: auto; background: var(--panel-bg);
  }
  .result-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .result-item:hover { background: var(--accent-soft); }
  .result-item.active {
    background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 9px;
  }
  .result-title { font-weight: 600; }
  .empty-msg { padding: 20px 14px; color: var(--text-dim); line-height: 1.5; }

  #detailPane { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .placeholder, .loading { color: var(--text-dim); padding: 20px; }

  .detail-header { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
  .detail-subheader { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }

  .preview-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  .preview-table tr { border-bottom: 1px solid var(--border); }
  .preview-table td { padding: 7px 6px; vertical-align: top; }
  .preview-label {
    width: 100px; color: var(--text-dim); font-weight: 600; font-size: 12px;
    white-space: nowrap; padding-right: 12px;
  }
  .preview-value.empty { color: var(--text-dim); font-style: italic; }

  #printBtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 10px 18px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  #printBtn:hover { opacity: 0.92; }
  #printBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  #printMsg { margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  #printMsg.error { color: var(--danger); }

  @media (max-width: 560px) {
    #main { flex-direction: column; }
    #resultsPane { width: 100%; max-width: 100%; max-height: 40%; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <input id="searchInput" type="text" placeholder="Search general contractors…" disabled />
    </div>
    <div id="status"></div>
    <div id="main">
      <div id="resultsPane"><div class="empty-msg">Loading…</div></div>
      <div id="detailPane"><div class="placeholder">Search for a general contractor and click a result to preview and print its info sheet.</div></div>
    </div>
  </div>

<script>
/* ================================================================
   CONFIG
   ================================================================ */
const CONFIG = {
  // The Grist table this widget searches.
  table: 'General_Contractors_Data',

  // Column used as the record title in search results / headers.
  titleField: 'General_Contractor_Name',

  // Columns to search across.
  searchFields: ['General_Contractor_Name', 'Also_Known_As'],

  // PDF field key -> column on the table. Only GC name, address, and
  // phone are filled on this sheet — no Date, per the current template.
  fieldMap: {
    gcName:  'General_Contractor_Name',
    address: 'Address',
    phone:   'Phone_Number',
  },

  // Path (relative to this HTML file) to the fillable PDF template.
  templateUrl: './project_info_sheet_gc.pdf',
};

/* ================================================================
   PDF_LAYOUT — x/y coordinates (PDF points, origin bottom-left) for
   each field on project_info_sheet_gc.pdf (the mastercraftNEW
   template — GC/Address/phone stacked in one box on the left, with
   PROJECT/ARCH mirrored in a box on the right). Re-measure these if
   you swap in a different template.

   Each field auto-shrinks its font to fit maxWidth (down to
   MIN_FONT_SIZE) before falling back to wrapping onto a couple of
   lines for the rare value too long to shrink to a readable size.
   ================================================================ */
const PAGE_HEIGHT = 720; // this template's page height, not 792
function pdfY(distanceFromTop, pad = 2) {
  return PAGE_HEIGHT - distanceFromTop + pad;
}

const PDF_LAYOUT = {
  gcName:  { x: 100, y: pdfY(101.3), maxWidth: 163 },
  address: { x: 124, y: pdfY(154.8), maxWidth: 140, wrapLineHeight: 10, maxLines: 2 },
  phone:   { x: 113, y: pdfY(220.2), maxWidth: 150 },
};

const BASE_FONT_SIZE = 10;
const MIN_FONT_SIZE = 8; // floor before falling back to wrapping instead of shrinking further

/* ================================================================
   MANUAL_FIELDS — everything on the sheet besides GC/Address/Phone
   (which come from Grist) becomes a real, clickable PDF form field
   in the downloaded file. Each one auto-sizes its font and centers
   text as the person types, directly in their PDF viewer — no need
   to come back to this widget to fill in the rest of the sheet.

   top/bottom are measured the same way as PDF_LAYOUT above (distance
   from the top of the page); width is the box width in points.
   multiline allows text to wrap and lets the box hold more than one
   line. Re-measure these if you swap in a different template.
   ================================================================ */
const MANUAL_FIELDS = [
  { key: 'date',           label: 'Date',              x: 460, top: 15,  bottom: 29.1,  width: 62,  multiline: false },
  { key: 'bonded',         label: 'Bonded',             x: 470, top: 37,  bottom: 48.9,  width: 53,  multiline: false },
  { key: 'project',        label: 'Project',            x: 345, top: 88,  bottom: 117.6, width: 134, multiline: true  },
  { key: 'archName',       label: 'Architect',          x: 325, top: 141, bottom: 168.8, width: 154, multiline: true  },
  { key: 'archPhone',      label: 'Architect phone',    x: 325, top: 207, bottom: 222.5, width: 154, multiline: false },
  { key: 'gcContact',      label: 'GC contact',         x: 117, top: 246, bottom: 275.2, width: 152, multiline: true  },
  { key: 'archContact',    label: 'Architect contact',  x: 326, top: 246, bottom: 274.7, width: 153, multiline: true  },
  { key: 'description',    label: 'Description',        x: 78,  top: 376, bottom: 599,   width: 391, multiline: true  },
  { key: 'jobsitePhone',   label: 'Jobsite phone',      x: 163, top: 618, bottom: 634,   width: 114, multiline: false },
  { key: 'jobsiteContact', label: 'Jobsite contact',    x: 329, top: 618, bottom: 634.5, width: 191, multiline: false },
  { key: 'other',          label: 'Other',              x: 116, top: 648, bottom: 663,   width: 404, multiline: true  },
];

/* ================================================================
   STATE
   ================================================================ */
const state = {
  schema: {},
  recordsCache: {},
  recordsById: {},
  searchResults: [],
  selected: null,
};

const el = {
  searchInput: document.getElementById('searchInput'),
  status: document.getElementById('status'),
  resultsPane: document.getElementById('resultsPane'),
  detailPane: document.getElementById('detailPane'),
};

function setStatus(msg, isError) {
  el.status.textContent = msg || '';
  el.status.className = isError ? 'error' : '';
}

/* ================================================================
   GRIST INIT
   ================================================================ */
grist.ready({
  requiredAccess: 'full',
});

init().catch(err => {
  console.error(err);
  setStatus('Error initializing widget: ' + err.message, true);
});

async function init() {
  setStatus('Loading document schema…');
  state.schema = await loadSchema();

  if (!state.schema[CONFIG.table]) {
    setStatus(`Table "${CONFIG.table}" not found. Check CONFIG.table.`, true);
    return;
  }

  await ensureTableCached(CONFIG.table);
  el.searchInput.disabled = false;
  el.searchInput.addEventListener('input', e => renderResults(e.target.value));
  setStatus('');
  renderResults('');
}

/* ================================================================
   SCHEMA / DATA
   ================================================================ */
async function loadSchema() {
  const tablesData = await grist.docApi.fetchTable('_grist_Tables');
  const tables = tableDataToRecords(tablesData);
  const tableRefToId = {};
  const tableIds = [];
  for (const t of tables) {
    tableRefToId[t.id] = t.tableId;
    tableIds.push(t.tableId);
  }

  const colsData = await grist.docApi.fetchTable('_grist_Tables_column');
  const cols = tableDataToRecords(colsData);

  const schema = {};
  for (const id of tableIds) schema[id] = { columns: [] };

  for (const c of cols) {
    if (c.colId === 'manualSort') continue;
    if (typeof c.colId === 'string' && c.colId.startsWith('gristHelper_')) continue;
    const tableId = tableRefToId[c.parentId];
    if (!tableId || !schema[tableId]) continue;
    schema[tableId].columns.push({ colId: c.colId, label: c.label || c.colId, type: c.type || '' });
  }
  return schema;
}

function tableDataToRecords(tableData) {
  const { id, ...cols } = tableData;
  const colNames = Object.keys(cols);
  return id.map((rowId, i) => {
    const rec = { id: rowId };
    for (const c of colNames) rec[c] = cols[c][i];
    return rec;
  });
}

async function ensureTableCached(tableId) {
  if (state.recordsCache[tableId]) return state.recordsCache[tableId];
  const raw = await grist.docApi.fetchTable(tableId);
  const records = tableDataToRecords(raw);
  state.recordsCache[tableId] = records;
  const byId = new Map();
  for (const r of records) byId.set(r.id, r);
  state.recordsById[tableId] = byId;
  return records;
}

function getRecordTitle(record) {
  if (!record) return '';
  const val = record[CONFIG.titleField];
  return (val === null || val === undefined || val === '') ? `#${record.id}` : String(val);
}

/* ================================================================
   SEARCH + RESULTS
   ================================================================ */
function renderResults(query) {
  const records = state.recordsCache[CONFIG.table] || [];
  const q = query.trim().toLowerCase();

  const matches = !q
    ? records
    : records.filter(r => CONFIG.searchFields.some(colId => {
        const v = r[colId];
        return v !== null && v !== undefined && String(v).toLowerCase().includes(q);
      }));

  state.searchResults = matches;

  if (matches.length === 0) {
    el.resultsPane.innerHTML = `<div class="empty-msg">No matches${q ? ` for "${escapeHtml(query)}"` : ''}.</div>`;
    return;
  }

  el.resultsPane.innerHTML = matches.slice(0, 300).map(r => {
    const active = state.selected && state.selected.rowId === r.id ? ' active' : '';
    return `<div class="result-item${active}" data-row-id="${r.id}">
      <div class="result-title">${escapeHtml(getRecordTitle(r))}</div>
    </div>`;
  }).join('');

  el.resultsPane.querySelectorAll('.result-item').forEach(node => {
    node.addEventListener('click', () => selectRecord(Number(node.dataset.rowId)));
  });
}

function selectRecord(rowId) {
  const record = state.recordsById[CONFIG.table]?.get(rowId);
  if (!record) return;
  state.selected = { rowId, record };
  renderResults(el.searchInput.value);
  renderDetail();
}

/* ================================================================
   DETAIL / PREVIEW PANEL
   ================================================================ */
function renderDetail() {
  const { record } = state.selected;

  const rows = Object.entries(CONFIG.fieldMap).map(([key, colId]) => {
    const val = record[colId];
    const display = (val === null || val === undefined || val === '')
      ? '<span class="preview-value empty">(empty — left blank on the PDF)</span>'
      : `<span class="preview-value">${escapeHtml(String(val))}</span>`;
    return `<tr><td class="preview-label">${escapeHtml(fieldLabel(key))}</td><td>${display}</td></tr>`;
  }).join('');

  el.detailPane.innerHTML = `
    <div class="detail-header">${escapeHtml(getRecordTitle(record))}</div>
    <div class="detail-subheader">${escapeHtml(CONFIG.table)} · row #${record.id}</div>
    <table class="preview-table"><tbody>${rows}</tbody></table>
    <button id="printBtn">Print PDF</button>
    <div id="printMsg"></div>
  `;

  document.getElementById('printBtn').addEventListener('click', onPrintPdf);
}

function fieldLabel(key) {
  return key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
}

/* ================================================================
   PDF FILLING
   ================================================================ */
async function onPrintPdf() {
  const btn = document.getElementById('printBtn');
  const msg = document.getElementById('printMsg');
  btn.disabled = true;
  msg.className = '';
  msg.textContent = 'Building PDF…';

  try {
    const record = state.selected.record;
    const data = {};
    for (const [key, colId] of Object.entries(CONFIG.fieldMap)) {
      data[key] = record[colId];
    }
    const bytes = await fillPdf(data);
    const filename = sanitizeFilename(getRecordTitle(record)) + '.pdf';
    downloadBytes(bytes, filename);
    msg.textContent = 'Downloaded.';
  } catch (err) {
    console.error(err);
    msg.className = 'error';
    msg.textContent = 'Error building PDF: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

async function fillPdf(data) {
  const templateBytes = await fetch(CONFIG.templateUrl).then(r => {
    if (!r.ok) throw new Error(`Could not load template PDF (${r.status}). Check CONFIG.templateUrl.`);
    return r.arrayBuffer();
  });

  const { PDFDocument, StandardFonts } = PDFLib;
  const pdfDoc = await PDFDocument.load(templateBytes);
  const page = pdfDoc.getPages()[0];
  // Times New Roman itself isn't embeddable (it's a licensed Monotype
  // font, not freely redistributable) — PDF's built-in Times-Roman is
  // the standard stand-in and is visually all but identical for this
  // kind of form text.
  const font = await pdfDoc.embedFont(StandardFonts.TimesRoman);

  // Draws text starting at (layout.x, layout.y), shrinking the font
  // down to MIN_FONT_SIZE to stay within layout.maxWidth. If it's
  // still too wide even at the floor size, wraps onto a couple of
  // lines at the floor size instead of shrinking further into
  // illegibility — keeps every field readable regardless of length.
  function drawFit(text, layout) {
    if (text === null || text === undefined || text === '') return; // leave blank, as requested
    const str = String(text);

    let size = BASE_FONT_SIZE;
    while (size > MIN_FONT_SIZE && font.widthOfTextAtSize(str, size) > layout.maxWidth) {
      size -= 0.5;
    }
    if (font.widthOfTextAtSize(str, size) <= layout.maxWidth) {
      page.drawText(str, { x: layout.x, y: layout.y, size, font });
      return;
    }

    size = MIN_FONT_SIZE;
    const words = str.split(/\s+/);
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (font.widthOfTextAtSize(test, size) > layout.maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    let y = layout.y;
    const lineHeight = layout.wrapLineHeight || 10;
    for (const l of lines.slice(0, layout.maxLines || 2)) {
      page.drawText(l, { x: layout.x, y, size, font });
      y -= lineHeight;
    }
  }

  drawFit(data.gcName, PDF_LAYOUT.gcName);
  drawFit(data.address, PDF_LAYOUT.address);
  drawFit(data.phone, PDF_LAYOUT.phone);

  addManualFields(pdfDoc, page, font);

  // updateFieldAppearances defaults to true, which would bake a fixed
  // computed font size into every field at save time — overwriting the
  // "0 = auto" setting we just gave them. Turning it off keeps the
  // fields genuinely auto-sizing/centering live in the person's PDF
  // viewer as they type, instead of a size frozen at save time.
  return pdfDoc.save({ updateFieldAppearances: false });
}

// Adds one real, clickable PDF form field per entry in MANUAL_FIELDS.
// Each is centered and set to font size 0 ("auto") so PDF viewers
// (Acrobat, Chrome's built-in viewer, etc.) grow or shrink the text
// live to fit the box as the person types — the same "click a box,
// type, it just fits" behavior as the baked-in GC fields, but left
// blank for the person to fill in by hand.
function addManualFields(pdfDoc, page, font) {
  const { TextAlignment, PDFName, PDFBool, rgb } = PDFLib;
  const form = pdfDoc.getForm();

  for (const f of MANUAL_FIELDS) {
    const height = f.bottom - f.top;
    const rectY = pdfY(f.bottom);
    const field = form.createTextField('manual_' + f.key);
    if (f.multiline) field.enableMultiline();
    field.setAlignment(TextAlignment.Center);
    field.addToPage(page, {
      x: f.x,
      y: rectY,
      width: f.width,
      height,
      font,
      borderWidth: 1,
      borderColor: rgb(0.7, 0.75, 0.73),
      backgroundColor: rgb(0.976, 0.984, 0.980),
    });
    field.setFontSize(0); // 0 = auto-size, per the PDF spec
  }

  // Tells PDF viewers to regenerate each field's appearance live
  // (font size/position) as the person edits it, rather than only
  // once at save time — required for the auto-size behavior to work.
  const acroForm = pdfDoc.catalog.lookup(PDFName.of('AcroForm'));
  if (acroForm) acroForm.set(PDFName.of('NeedAppearances'), PDFBool.True);
}

function downloadBytes(bytes, filename) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function sanitizeFilename(name) {
  return String(name).replace(/[^a-z0-9\-_. ]/gi, '_').trim() || 'contractor';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
</body>
</html>
